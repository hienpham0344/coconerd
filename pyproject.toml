[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-conversation-organizer"
version = "0.1.0"
description = "Durable backend for organizing Discord conversations by topic"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "langgraph>=0.2,<2",
  "openai>=1.50,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
organizer-worker = "backend.worker:main"
organizer-api = "backend.presentation.api.cli:main"

[project.optional-dependencies]
dev = [
  "discord.py>=2.3.2,<3.0.0",
  "groq>=0.11.0",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["backend*", "scripts*"]

[tool.setuptools.package-data]
"backend.application.data" = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"backend/presentation/api/routers/*.py" = ["B008"]
